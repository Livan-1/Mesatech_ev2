spring.application.name=ms-catalogo

# Puerto interno (el BFF lo llama por la red de Docker: http://ms-catalogo:8082)
server.port=${SERVER_PORT:8082}

# Entra ID (se conserva de la EP1; las rutas /v1/** son internas y no exigen token)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE}

# ===== RDS Catalogo (credenciales solo por variables de entorno) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== RabbitMQ (EC2 C, por IP privada) =====
spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.virtual-host=${RABBIT_VHOST:mesatech}
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASS}
spring.rabbitmq.connection-timeout=5s
# Confirmaciones del broker y retorno de mensajes sin ruta
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

mesatech.rabbit.exchange=catalogo.exchange
mesatech.rabbit.routing-key=categoria.creada

logging.level.cl.duoc=INFO
