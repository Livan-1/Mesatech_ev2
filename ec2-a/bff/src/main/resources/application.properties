spring.application.name=bff

server.port=${SERVER_PORT:8080}

# Entra ID: validacion del access token (issuer + audience + firma + expiracion)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE}

# Origenes permitidos para CORS (separados por coma)
mesatech.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# URLs internas de los microservicios: se leen de las variables de entorno
# CATALOG_SERVICE_URL, ORDERS_SERVICE_URL y CATEGORIAS_LOCALES_URL (ver bff.env).
# El BFF no accede a ninguna base de datos.

logging.level.org.springframework.security=INFO
