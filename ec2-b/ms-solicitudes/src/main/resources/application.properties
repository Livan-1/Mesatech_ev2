spring.application.name=ms-solicitudes

# El BFF (EC2 A) lo llama por la IP privada de esta EC2
server.port=${SERVER_PORT:8081}

# Entra ID (se conserva de la EP1; las rutas /v1/** son internas y no exigen token)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE}

# ===== RDS Solicitudes (credenciales solo por variables de entorno) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== RabbitMQ (EC2 C, por IP privada) =====
spring.rabbitmq.host=${RABBIT_HOST}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.virtual-host=${RABBIT_VHOST:mesatech}
spring.rabbitmq.username=${RABBIT_USER}
spring.rabbitmq.password=${RABBIT_PASS}
# AUTO: el ack se envia solo si el listener termina sin excepcion (despues de guardar en RDS)
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=1
# No declarar la cola: ya existe y sub_solicitudes no tiene permiso "configure"
spring.rabbitmq.listener.simple.missing-queues-fatal=false

mesatech.rabbit.queue=solicitudes.catalogo.queue

logging.level.cl.duoc=INFO
